[project]
name = "tart-stefcal"
version = "0.1.0"
description = "StEFCal: alternating per-antenna complex-gain least squares solver for TART"
readme = "README.md"
authors = [
    { name = "Tim Molteno", email = "tim@elec.ac.nz" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "tart-tools>=1.4.5",
    "h5py>=3.0",
    "tart-catalogue-client>=0.4.1",
]

[project.optional-dependencies]
gpu = [
    "cupy>=13.0",
]

[project.scripts]
tart-stefcal = "tart_stefcal:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
