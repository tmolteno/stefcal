[project]
name = "tart-stefcal"
version = "0.1.0"
description = "StEFCal: alternating per-antenna complex-gain least squares solver"
readme = "README.md"
authors = [
    { name = "Tim Molteno", email = "tim@elec.ac.nz" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = [
    "cupy>=13.0",
]

[project.scripts]
tart-stefcal = "tart_stefcal:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
